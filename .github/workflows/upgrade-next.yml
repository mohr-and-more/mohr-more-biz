name: Upgrade Next for OpenNext

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install next@16.4.6 eslint-config-next@16.4.6 --no-audit --no-fund
      - run: |
          git config user.name "AgentMohr"
          git config user.email "agentmohr@agentmail.to"
          git add package.json package-lock.json
          git commit -m "chore(deps): Next 16.4.6 für den OpenNext-Adapter"
          git push
