<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MOHR &amp; MORE — Organigramm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#030303; --surface:#0a0a0a; --card:#0f0f0f; --border:#1a1a1a;
    --text:#e5e5e5; --text-secondary:#666; --accent:#00e5ff;
    --purple:#bd93f9; --cyan2:#00f2ff;
    --grad:linear-gradient(90deg,#00f2ff,#bd93f9);
    --radius:.5rem; --radius-lg:.75rem; --radius-xl:1rem;
    --font-body:"Inter",sans-serif; --font-heading:"Space Grotesk",sans-serif; --font-mono:"Space Mono",monospace;
    --shadow-glow:0 0 20px #ffffff26; --accent-glow:0 0 24px #00e5ff33;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:var(--font-body);font-weight:300;line-height:1.625;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  /* ambient background glow */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(circle at 12% 8%, #00f2ff12 0%, #0000 45%),
      radial-gradient(circle at 88% 92%, #bd93f908 0%, #0000 50%);
  }
  .app{position:relative;z-index:1;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100vh}

  /* ---------- HEADER ---------- */
  header{
    padding:1.1rem 1.6rem;border-bottom:1px solid var(--border);
    background:rgba(3,3,3,.8);backdrop-filter:blur(10px);
    display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap;
  }
  .brand{display:flex;flex-direction:column;gap:.15rem;min-width:0}
  .brand h1{
    font-family:var(--font-heading);font-weight:700;font-size:1.35rem;letter-spacing:-.02em;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand .sub{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--text-secondary)}
  .stat{font-family:var(--font-mono);font-size:.72rem;color:var(--text-secondary);
    display:flex;align-items:baseline;gap:.35rem;white-space:nowrap}
  .stat b{color:var(--accent);font-weight:700;font-size:.85rem}
  .stats{display:flex;gap:1.1rem;flex-wrap:wrap;margin-left:auto}

  .searchwrap{position:relative;flex:1 1 220px;max-width:340px;margin-left:.4rem}
  .search{
    width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:.5rem .9rem .5rem 2.1rem;color:var(--text);font-family:var(--font-body);font-size:.85rem;
    transition:border-color .15s, box-shadow .15s;
  }
  .search:focus{outline:none;border-color:var(--accent);box-shadow:var(--accent-glow)}
  .search::placeholder{color:#555}
  .searchwrap svg{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);opacity:.4}

  .ctrls{display:flex;gap:.4rem}
  .btn{
    background:var(--card);border:1px solid var(--border);color:var(--text-secondary);
    font-family:var(--font-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
    padding:.45rem .7rem;border-radius:var(--radius);cursor:pointer;transition:all .15s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:var(--accent-glow)}

  /* ---------- LAYOUT ---------- */
  .main{display:grid;grid-template-columns:minmax(320px,420px) 1fr;overflow:hidden}
  @media(max-width:880px){.main{grid-template-columns:1fr}}

  /* ---------- TREE PANEL ---------- */
  .tree-panel{
    border-right:1px solid var(--border);overflow:auto;padding:.6rem .4rem 3rem;
    background:linear-gradient(180deg,var(--surface),var(--bg));
  }
  .tree-panel::-webkit-scrollbar,.detail-panel::-webkit-scrollbar{width:8px}
  .tree-panel::-webkit-scrollbar-thumb,.detail-panel::-webkit-scrollbar-thumb{background:#222;border-radius:4px}
  .tree-panel::-webkit-scrollbar-thumb:hover,.detail-panel::-webkit-scrollbar-thumb:hover{background:#333}

  ul.tree,ul.tree ul{list-style:none}
  ul.tree ul{margin-left:1.05rem;border-left:1px solid var(--border);padding-left:.35rem}
  li.node{position:relative;margin:.18rem 0}
  .nrow{
    display:flex;align-items:center;gap:.5rem;padding:.4rem .55rem;border-radius:var(--radius);
    cursor:pointer;transition:background .12s,box-shadow .12s;border:1px solid transparent;
  }
  .nrow:hover{background:#141414}
  .nrow.sel{background:rgba(0,229,255,.08);border-color:rgba(0,229,255,.35);box-shadow:var(--accent-glow)}
  .nrow.dim{opacity:.28}
  .nrow.hit{background:rgba(0,242,255,.12)}
  .toggle{
    width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;
    color:var(--text-secondary);font-family:var(--font-mono);font-size:.7rem;flex:0 0 auto;
    transition:transform .15s;user-select:none;
  }
  .toggle.empty{visibility:hidden}
  .toggle.open{transform:rotate(90deg)}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 6px currentColor}
  .nmeta{min-width:0;flex:1}
  .nname{font-weight:500;font-size:.86rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ntitle{font-size:.7rem;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{
    font-family:var(--font-mono);font-size:.58rem;letter-spacing:.05em;text-transform:uppercase;
    padding:.08rem .34rem;border-radius:3px;border:1px solid var(--border);color:var(--text-secondary);flex:0 0 auto;
  }
  .nrow .count{font-family:var(--font-mono);font-size:.62rem;color:#555;flex:0 0 auto}

  /* adapter colors */
  .a-pi_local{color:#00e5ff} .a-claude_local{color:#bd93f9}
  .a-hermes_local{color:#50fa7b} .a-process{color:#ffb86c}

  /* level tint on the dot via data attr handled in JS badge color */
  .lv-CEO .nname{color:#00f2ff;font-weight:600}
  .lv-C-Level .badge,.lv-CEO .badge{color:var(--purple);border-color:#3a2a55}
  .lv-Ausführende .badge{color:#50fa7b;border-color:#1e3a26}

  /* ---------- DETAIL PANEL ---------- */
  .detail-panel{overflow:auto;padding:2rem 2.2rem 4rem}
  .empty-state{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1rem;color:var(--text-secondary);text-align:center}
  .empty-state .big{font-family:var(--font-heading);font-size:2.4rem;background:var(--grad);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .empty-state .hint{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);
    padding:1.6rem;margin-bottom:1.2rem;position:relative;overflow:hidden;
  }
  .card.glow::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad)}
  .kicker{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);margin-bottom:.5rem}
  .dname{font-family:var(--font-heading);font-weight:700;font-size:1.9rem;letter-spacing:-.02em;line-height:1.1;margin-bottom:.3rem}
  .dtitle{color:var(--text-secondary);font-size:.95rem;margin-bottom:1.1rem}
  .chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.1rem}
  .chip{font-family:var(--font-mono);font-size:.68rem;padding:.3rem .6rem;border-radius:var(--radius);
    border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;gap:.35rem}
  .chip .swatch{width:8px;height:8px;border-radius:50%}
  .chip.status-running{color:#50fa7b;border-color:#1e3a26}
  .chip.status-idle{color:var(--text-secondary)}
  .chip.status-active{color:var(--accent)}
  .openlink{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font-mono);font-size:.72rem;
    color:var(--accent);text-decoration:none;border:1px solid var(--border);padding:.45rem .8rem;border-radius:var(--radius);
    transition:all .15s;text-transform:uppercase;letter-spacing:.06em}
  .openlink:hover{border-color:var(--accent);box-shadow:var(--accent-glow)}

  .sectitle{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--text-secondary);margin:1.4rem 0 .7rem;display:flex;align-items:center;gap:.5rem}
  .sectitle::after{content:"";flex:1;height:1px;background:var(--border)}

  .childgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.6rem}
  .minicard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:.7rem .85rem;cursor:pointer;transition:all .15s}
  .minicard:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--accent-glow)}
  .minicard .mn{font-weight:500;font-size:.84rem;display:flex;align-items:center;gap:.4rem}
  .minicard .mt{font-size:.68rem;color:var(--text-secondary);margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .legend{display:flex;flex-wrap:wrap;gap:.8rem;font-family:var(--font-mono);font-size:.66rem;color:var(--text-secondary)}
  .legend span{display:inline-flex;align-items:center;gap:.3rem}

  .pathline{font-family:var(--font-mono);font-size:.7rem;color:#555;margin-bottom:1rem;word-break:break-word}
  .pathline b{color:var(--text-secondary)}
</style>
</head>

 "hermes_local", "status": "active", "urlKey": "pareto", "level": "Directors / Leads", "children": []}, {"id": "d4a8af5d-db5e-44be-8a64-63ad73a3294c", "name": "RootCause", "title": "Root Cause Analysis Specialist", "adapter": "hermes_local", "status": "active", "urlKey": "rootcause", "level": "Directors / Leads", "children": []}, {"id": "98688c43-5937-44f1-a8d4-50ca75653499", "name": "SWOT", "title": "SWOT Analysis Specialist", "adapter": "hermes_local", "status": "active", "urlKey": "swot", "level": "Directors / Leads", "children": []}, {"id": "7867eed0-7dfe-4bf9-af1d-83c8fbbcd7c3", "name": "SecondOrder", "title": "Second-Order Thinking Specialist", "adapter": "hermes_local", "status": "active", "urlKey": "secondorder", "level": "Directors / Leads", "children": []}, {"id": "5f7f9d2a-03fa-4a45-a4f2-cb28824f1374", "name": "Magnus", "title": "Strategic Analysis Specialist", "adapter": "hermes_local", "status": "idle", "urlKey": "magnus", "level": "Directors / Leads", "children": []}, {"id": "2d4a5994-0ac8-4ccf-ba23-4f283a5fa331", "name": "Inversion", "title": "Strategic Inversion Analyst", "adapter": "hermes_local", "status": "active", "urlKey": "inversion", "level": "Directors / Leads", "children": []}]}, {"id": "c771b340-22f8-475b-bf75-e4a769be7d1e", "name": "Zorro", "title": "System Administrator", "adapter": "hermes_local", "status": "idle", "urlKey": "zorro", "level": "C-Level", "children": []}]}, {"id": "507e8948-faa4-4616-9ad3-dffc401a3296", "name": "TradingAI", "title": "general", "adapter": "process", "status": "idle", "urlKey": "tradingai", "level": "Spezial-System", "children": []}, {"id": "47b0722d-1fb6-4759-b14b-042863322a3e", "name": "Splinter", "title": "Fullstack Development Specialist", "adapter": "hermes_local", "status": "idle", "urlKey": "splinter", "level": "Ausführende", "children": [{"id": "7ee333ad-f976-4f07-93d7-fc154a7a43bc", "name": "Tinker", "title": "Prototyping Specialist", "adapter": "hermes_local", "status": "idle", "urlKey": "tinker", "level": "C-Level", "children": []}]}];
const ADAPTER_COLOR = {pi_local:"#00e5ff",claude_local:"#bd93f9",hermes_local:"#50fa7b",process:"#ffb86c"};
const AGENT_BASE="/MMB/agents/";

// index
const byId={};
DATA.forEach(root=>(function idx(n,parent){n._p=parent;byId[n.id]=n;n.children.forEach(c=>idx(c,n));})(root,null));

function countSub(n){let c=1;n.children.forEach(x=>c+=countSub(x));return c;}

// render tree
const treeEl=document.getElementById('tree');
function render(parent, nodes){
  const ul=document.createElement('ul');ul.className="tree"+(parent?"":"");
  nodes.forEach(n=>{
    const li=document.createElement('li');li.className="node";
    const row=document.createElement('div');row.className="nrow lv-"+(n.level||"");row.dataset.id=n.id;
    const hasKids=n.children.length>0;
    const tog=document.createElement('span');tog.className="toggle"+(hasKids?" open":" empty");tog.textContent=hasKids?"▸":"";
    const dot=document.createElement('span');dot.className="dot a-"+(n.adapter||"process");dot.style.color=ADAPTER_COLOR[n.adapter]||"#888";
    const meta=document.createElement('div');meta.className="nmeta";
    const nm=document.createElement('div');nm.className="nname";nm.textContent=n.name;
    const tt=document.createElement('div');tt.className="ntitle";tt.textContent=n.title;
    meta.appendChild(nm);meta.appendChild(tt);
    const bdg=document.createElement('span');bdg.className="badge";bdg.textContent=n.level||"";
    row.appendChild(tog);row.appendChild(dot);row.appendChild(meta);row.appendChild(bdg);
    if(hasKids){const ct=document.createElement('span');ct.className="count";ct.textContent=countSub(n);row.appendChild(ct);}
    li.appendChild(row);
    let childUl=null;
    if(hasKids){childUl=render(li,n.children);childUl.hidden=false;}
    li._childUl=childUl;
    row.addEventListener('click',e=>{
      if(e.target.classList.contains('toggle')&&hasKids){toggle(li);}
      else if(hasKids && e.shiftKey){toggle(li);}
      select(n);
    });
    parent?parent.appendChild(ul):(treeEl.appendChild(ul));
    ul.appendChild(li);
  });
  return ul;
}
render(null,DATA);

function toggle(li){const u=li._childUl;if(!u)return;u.hidden=!u.hidden;li.querySelector('.toggle').classList.toggle('open',!u.hidden);}

function clearSel(){document.querySelectorAll('.nrow.sel').forEach(r=>r.classList.remove('sel'));}

function select(n){
  clearSel();
  const row=treeEl.querySelector('.nrow[data-id="'+CSS.escape(n.id)+'"]');
  if(row){row.classList.add('sel');row.scrollIntoView({block:'nearest',behavior:'smooth'});}
  renderDetail(n);
}

// path
function pathOf(n){const p=[];let c=n;while(c){p.unshift(c.name);c=c._p;}return p;}

function renderDetail(n){
  const det=document.getElementById('detail');
  const chipColor=ADAPTER_COLOR[n.adapter]||"#888";
  const status=(n.status||"active");
  const isCEO=n.level==="CEO";
  const pathStr=pathOf(n).join("  ›  ");
  let html='<div class="card'+(isCEO?" glow":"")+'">';
  html+='<div class="kicker">'+(n.level||"Agent")+' · '+(n.adapter||"")+'</div>';
  html+='<div class="dname">'+esc(n.name)+'</div>';
  html+='<div class="dtitle">'+esc(n.title)+'</div>';
  html+='<div class="pathline"><b>Pfad:</b> '+esc(pathStr)+'</div>';
  html+='<div class="chips">';
  html+='<span class="chip"><i class="swatch" style="background:'+chipColor+'"></i>'+esc(n.adapter||"-")+'</span>';
  html+='<span class="chip status-'+status+'">● '+esc(status)+'</span>';
  if(n.children.length)html+='<span class="chip">▼ '+n.children.length+' direkte Reports · '+countSub(n)+' gesamt</span>';
  html+='</div>';
  if(n.urlKey)html+='<a class="openlink" target="_blank" rel="noopener" href="'+AGENT_BASE+esc(n.urlKey)+'">Profil öffnen ↗</a>';
  html+='</div>';

  if(n.children.length){
    html+='<div class="sectitle">Direkte Reports ('+n.children.length+')</div>';
    html+='<div class="childgrid">';
    n.children.slice().sort((a,b)=>(a.level||"").localeCompare(b.level||"")||a.name.localeCompare(b.name)).forEach(c=>{
      const col=ADAPTER_COLOR[c.adapter]||"#888";
      html+='<div class="minicard" data-id="'+c.id+'"><div class="mn"><i class="dot" style="color:'+col+';width:8px;height:8px;border-radius:50%;display:inline-block"></i>'+esc(c.name)+'</div><div class="mt">'+esc(c.title)+'</div></div>';
    });
    html+='</div>';
  }
  det.innerHTML=html;
  det.querySelectorAll('.minicard').forEach(mc=>mc.addEventListener('click',()=>{const t=byId[mc.dataset.id];if(t){select(t);}}));
}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

// search
const search=document.getElementById('search');
let allRows=[...document.querySelectorAll('.nrow')];
function doSearch(q){
  q=q.trim().toLowerCase();
  allRows.forEach(r=>{r.classList.remove('hit','dim')});
  if(!q){return;}
  const hits=new Set();
  Object.values(byId).forEach(n=>{
    if((n.name||"").toLowerCase().includes(q)||(n.title||"").toLowerCase().includes(q)||(n.level||"").toLowerCase().includes(q)){
      hits.add(n.id);
    }
  });
  // expand ancestors of hits
  hits.forEach(id=>{let c=byId[id];while(c&&c._p){const li=treeEl.querySelector('.nrow[data-id="'+CSS.escape(c.id)+'"]')?.parentElement; if(li&&li._childUl&&li._childUl.hidden){li._childUl.hidden=false;li.querySelector('.toggle')?.classList.add('open');} c=c._p;}});
  allRows.forEach(r=>{if(hits.has(r.dataset.id))r.classList.add('hit');else r.classList.add('dim');});
}
search.addEventListener('input',e=>doSearch(e.target.value));

// controls
document.getElementById('expandAll').addEventListener('click',()=>document.querySelectorAll('.tree li').forEach(li=>{if(li._childUl){li._childUl.hidden=false;li.querySelector('.toggle')?.classList.add('open');}}));
document.getElementById('collapseAll').addEventListener('click',()=>document.querySelectorAll('.tree > ul > li').forEach(li=>{collapse(li);}));
function collapse(li){if(li._childUl){li._childUl.hidden=true;li.querySelector('.toggle')?.classList.remove('open');li._childUl.querySelectorAll('li').forEach(collapse);}}

// default: collapse deep levels (keep CEO + C-Level open), select KALi
(function init(){
  // collapse everything under C-Level (depth>=2)
  const kali=DATA[0];
  kali.children.forEach(c=>{const li=treeEl.querySelector('.nrow[data-id="'+CSS.escape(c.id)+'"]')?.parentElement; if(li)collapse(li);});
  select(kali);
})();
</script>
