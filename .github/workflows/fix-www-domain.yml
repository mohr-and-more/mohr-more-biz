name: Fix www subdomain

# Temporary repair workflow: www.mohr-more.biz answered 522 because its proxied
# DNS record still pointed at a dead origin instead of the Pages project.
# Remove this file once the subdomain serves the site.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the fix (false = inspection only)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  fix-www:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and repair www.mohr-more.biz
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -uo pipefail
          ZONE_NAME="mohr-more.biz"
          PROJECT="mohr-more"
          HOST="www.mohr-more.biz"
          TARGET="${PROJECT}.pages.dev"

          api() {
            local method="$1" path="$2" data="${3:-}"
            if [ -n "$data" ]; then
              curl -sS -X "$method" "https://api.cloudflare.com/client/v4${path}" \
                -H "Authorization: Bearer ${CF_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "${data}"
            else
              curl -sS -X "$method" "https://api.cloudflare.com/client/v4${path}" \
                -H "Authorization: Bearer ${CF_TOKEN}"
            fi
          }

          echo "::group::token + zone"
          api GET /user/tokens/verify | jq -c '{success,errors,status:.result.status}'
          ZONE_JSON=$(api GET "/zones?name=${ZONE_NAME}")
          echo "${ZONE_JSON}" | jq -c '.result[]? | {id,name,status}'
          ZONE_ID=$(echo "${ZONE_JSON}" | jq -r '.result[0].id // empty')
          if [ -z "${ZONE_ID}" ]; then echo "No zone id for ${ZONE_NAME}"; exit 1; fi
          echo "zone_id=${ZONE_ID}"
          echo "::endgroup::"

          echo "::group::pages project"
          api GET "/accounts/${CF_ACCOUNT}/pages/projects/${PROJECT}" \
            | jq -c '{success,errors,project:{name:.result.name,subdomain:.result.subdomain,domains:.result.domains}}'
          echo "::endgroup::"

          echo "::group::current dns records for ${HOST}"
          RECS=$(api GET "/zones/${ZONE_ID}/dns_records?name=${HOST}")
          echo "${RECS}" | jq -c '.result[]? | {id,type,name,content,proxied,ttl}'
          REC_ID=$(echo "${RECS}" | jq -r '.result[0].id // empty')
          echo "record_id=${REC_ID:-<none>}"
          echo "::endgroup::"

          if [ "${APPLY}" != "true" ]; then
            echo "APPLY=false - inspection only, nothing changed."
            exit 0
          fi

          echo "::group::attach ${HOST} to pages project ${PROJECT}"
          api POST "/accounts/${CF_ACCOUNT}/pages/projects/${PROJECT}/domains" \
            "{\"name\":\"${HOST}\"}" \
            | jq -c '{success,errors,messages,domain:{name:.result.name,status:.result.status}}'
          echo "::endgroup::"

          echo "::group::point dns record at ${TARGET}"
          BODY="{\"type\":\"CNAME\",\"name\":\"${HOST}\",\"content\":\"${TARGET}\",\"proxied\":true,\"ttl\":1}"
          if [ -n "${REC_ID}" ]; then
            api PATCH "/zones/${ZONE_ID}/dns_records/${REC_ID}" "${BODY}" | jq -c '{success,errors,record:{type:.result.type,content:.result.content,proxied:.result.proxied}}'
          else
            api POST "/zones/${ZONE_ID}/dns_records" "${BODY}" | jq -c '{success,errors,record:{type:.result.type,content:.result.content,proxied:.result.proxied}}'
          fi
          echo "::endgroup::"

          echo "::group::verify"
          APEX_TITLE=$(curl -sS --max-time 20 "https://${ZONE_NAME}/" | grep -o '<title>[^<]*' | head -1 || true)
          echo "apex title: ${APEX_TITLE}"
          WWW_CODE=""
          for i in $(seq 1 12); do
            WWW_CODE=$(curl -sS -o /tmp/www.html -w '%{http_code}' --max-time 20 "https://${HOST}/" || echo "curl-error")
            echo "attempt ${i}: https://${HOST}/ -> ${WWW_CODE}"
            [ "${WWW_CODE}" = "200" ] && break
            sleep 10
          done
          WWW_TITLE=$(grep -o '<title>[^<]*' /tmp/www.html 2>/dev/null | head -1 || true)
          echo "www title: ${WWW_TITLE}"
          if [ "${WWW_CODE}" = "200" ] && [ "${WWW_TITLE}" = "${APEX_TITLE}" ]; then
            echo "RESULT: www serves the same page as the apex."
          else
            echo "RESULT: www still not serving the apex page (status ${WWW_CODE})."
          fi
          echo "::endgroup::"
