name: One-shot contact form unify

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch anwenden
        run: node scripts/apply-contact-form-de-patch.mjs
      - name: Commit und Push
        run: |
          git config user.name "AgentMohr"
          git config user.email "agentmohr@agentmail.to"
          git add -A
          git commit -m "refactor(kontakt): DE-Seite nutzt ContactForm, Formular-Strings in i18n"
          git push
