name: Kontakt-Anfragen nachzustellen

# Stellt Anfragen aus dem KV-Archiv erneut zu, deren Mailversand gescheitert
# ist. Läuft alle 30 Minuten und auf Zuruf. Die Logik — inklusive Alarm bei
# Fehlschlag — steht in scripts/kontakt-retry-run.mjs; ein Fehlschlag geht
# zusätzlich an secrets.KONTAKT_ALERT_WEBHOOK (siehe
# kontaktformular-setup.md, Schritt 5).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Retry pending contact inquiries
        env:
          RETRY_URL: ${{ vars.KONTAKT_RETRY_URL || 'https://mohr-more.biz/api/kontakt/retry' }}
          RETRY_TOKEN: ${{ secrets.KONTAKT_RETRY_TOKEN }}
          ALERT_WEBHOOK: ${{ secrets.KONTAKT_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/kontakt-retry-run.mjs
