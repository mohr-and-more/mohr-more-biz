name: One-shot contact endpoint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch anwenden
        run: node scripts/apply-contact-endpoint-patch.mjs
      - name: Commit und Push
        run: |
          git config user.name "AgentMohr"
          git config user.email "agentmohr@agentmail.to"
          git add -A
          git commit -m "fix(kontakt): Formulare nutzen auf fremden Hosts die kanonische Function"
          git push
